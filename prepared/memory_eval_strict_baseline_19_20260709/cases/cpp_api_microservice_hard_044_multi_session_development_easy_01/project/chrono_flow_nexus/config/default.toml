# =============================================================================
# ChronoFlow Nexus - Default Configuration
# -----------------------------------------------------------------------------
# This file provides the baseline configuration for ChronoFlow Nexus. All
# settings are overridable via environment variables or environment–specific
# TOML files (e.g. `staging.toml`, `production.toml`) that are merged at start-up
# in ascending order of precedence:
#
#   1. default.toml           (this file)
#   2. <env>.toml             (optional)
#   3. Environment variables  (highest priority)
#
# Environment variables follow the convention: `CFN_<SECTION>_<KEY>`.
# For example, to override `server.port`, export `CFN_SERVER_PORT=8443`.
#
# NOTE:
#   • All time durations are expressed in ISO-8601 format unless specified
#     otherwise (e.g. "30s" for 30 seconds, "15m" for 15 minutes).
#   • Size values are specified as plain integers in bytes, or with
#     human-readable suffixes (e.g. "512KiB", "5MiB", "1GiB").
#
# =============================================================================

###############################################################################
# Service Identity
###############################################################################
[service]
name        = "ChronoFlow Nexus"
instance_id = "${HOSTNAME}"              # Resolved at runtime if supported
version     = "v1.4.0"                   # Semantic version of this build
environment = "development"              # Overridden per deployment target
region      = "local"

###############################################################################
# Networking & Transport
###############################################################################
[server]
# Multi-port binding allows REST and GraphQL to run on dedicated sockets if
# necessary—useful for zero-downtime canaries and phased roll-outs.
#
# Example:
#   [[server.listeners]]
#   type  = "rest"
#   host  = "0.0.0.0"
#   port  = 8080
#

# Default listener list
[[server.listeners]]
type            = "http"                 # [http|https|grpc|unix]
host            = "0.0.0.0"
port            = 8080
keep_alive_mins = 3

# TLS settings are only used when type == "https"
[server.tls]
enabled      = false
# Paths can be relative to the execution directory or absolute
cert_chain   = "./certs/server.crt"
private_key  = "./certs/server.key"
require_mtls = false                     # Mutual TLS for internal clients
client_ca    = "./certs/ca.crt"

# Cross-origin resource sharing policy
[server.cors]
allowed_origins = ["*"]
allowed_methods = ["GET", "POST", "PUT", "PATCH", "DELETE"]
allowed_headers = ["*"]
max_age_secs    = 86400
allow_credentials = true

# Global HTTP request limits
[server.limits]
max_header_bytes   = "64KiB"
max_body_bytes     = "10MiB"
read_timeout       = "30s"
write_timeout      = "30s"
idle_timeout       = "3m"

###############################################################################
# Persistence & State
###############################################################################
# --------------------------------------------------------------------------- #
# Primary Postgres database
# --------------------------------------------------------------------------- #
[database]
driver   = "postgres"
dsn      = "postgresql://chrono:chrono@127.0.0.1:5432/chronoflow"
pool_min = 5
pool_max = 30
# Connection recycling—close and reopen after this threshold to prevent leaks
max_lifetime = "55m"

[database.migrations]
# Set to true to apply migrations on start-up (NOT recommended on prod)
auto_apply = false
path       = "./migrations"

# --------------------------------------------------------------------------- #
# Redis (Cache & Message Brokering)
# --------------------------------------------------------------------------- #
[redis]
url            = "redis://localhost:6379/0"
pool_min       = 4
pool_max       = 16
connect_timeout = "2s"
read_timeout    = "500ms"
write_timeout   = "500ms"

###############################################################################
# Observability
###############################################################################
[logging]
level            = "debug"               # trace|debug|info|warn|error|fatal
format           = "json"                # json|text
output           = "stdout"              # stdout|stderr|/var/log/chronoflow.log
color            = false
log_rotation     = true
rotation_max_mb  = 100
rotation_max_age = "14d"
rotation_backup  = 10

[metrics]
# Prometheus exporter settings
enabled = true
host    = "0.0.0.0"
port    = 9300
path    = "/metrics"

# --------------------------------------------------------------------------- #
# Distributed Tracing (OpenTelemetry)
# --------------------------------------------------------------------------- #
[tracing]
enabled      = true
service_name = "chrono_flow_nexus"
# exporter can be: "otlp_http", "otlp_grpc", "jaeger", "zipkin"
exporter     = "otlp_http"

[tracing.sampler]
# Sampler type: parentbased_always_on|parentbased_traceidratio|always_off
type        = "parentbased_traceidratio"
# Between 0.0 (0%) and 1.0 (100%)
ratio       = 0.10

[tracing.exporter]
endpoint    = "http://localhost:4318/v1/traces"
timeout     = "5s"
headers     = { "x-auth-token" = "dev-token" }

###############################################################################
# Application Layer
###############################################################################
[graphql]
schema_path      = "./schema/chronoflow.graphql"
introspection    = true
max_query_depth  = 12
max_complexity   = 200
graphiql_enabled = true
batch_requests   = true

[rate_limiting]
# Leaky-bucket algorithm defaults
enabled          = true
window           = "1m"
max_requests     = 150
# Rate limits can be overridden for specific paths
[[rate_limiting.overrides]]
path         = "/api/v1/admin/*"
window       = "1m"
max_requests = 30

[caching]
# HTTP response cache
enabled          = true
default_ttl      = "30s"
max_ttl          = "10m"
# Resource-specific TTL overrides
[[caching.overrides]]
path = "/api/v1/analytics/*"
ttl  = "5m"

[pagination]
default_page_size = 50
max_page_size     = 500

###############################################################################
# Security
###############################################################################
[security]
# JSON Web Token settings
jwt_issuer     = "chronoflow.local"
jwt_audience   = "chronoflow_users"
jwt_expires_in = "12h"
jwt_algorithm  = "HS256"
jwt_secret     = "REPLACE-ME-IN-PROD"

# API keys for service-to-service calls
[[security.api_keys]]
name   = "internal_scheduler"
token  = "SCHEDULER-TOKEN-PLACEHOLDER"
scopes = ["read:all", "write:task"]

###############################################################################
# Feature Flags (defaults; toggle via LaunchDarkly or env vars in prod)
###############################################################################
[feature_flags]
enable_focus_analytics     = true
enable_flow_state_stream   = false
enable_async_export        = false
enable_usage_based_pricing = false

###############################################################################
# Background Jobs & Workers
###############################################################################
[jobs]
concurrency  = 8
retry_backoff_secs = [5, 30, 120, 300]   # Exponential back-off schedule

[[jobs.schedules]]
name       = "daily_metrics_rollup"
cron       = "0 2 * * *"                 # Every day at 02:00 UTC
max_retry  = 3
timeout    = "1h"

[[jobs.schedules]]
name       = "db_maintenance"
cron       = "0 4 * * SUN"               # Every Sunday at 04:00 UTC
max_retry  = 1
timeout    = "2h"

###############################################################################
# Third-Party Integrations
###############################################################################
[integrations.slack]
enabled   = false
webhook   = ""
channel   = "#alerts"

[integrations.datadog]
enabled   = false
api_key   = ""
app_key   = ""

###############################################################################
# Local Development Tweaks
###############################################################################
[dev]
hot_reload           = true
mock_external_calls  = true
allow_unsafe_tls     = true

# End of file
