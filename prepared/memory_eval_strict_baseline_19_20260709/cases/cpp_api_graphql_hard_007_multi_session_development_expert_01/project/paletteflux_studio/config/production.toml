# =======================================================================
# PaletteFlux GraphQL Studio – Production Configuration
# -----------------------------------------------------------------------
# File: paletteflux_studio/config/production.toml
#
# This file contains production-grade configuration for the PaletteFlux
# GraphQL Studio backend.  Edit with care—changes here affect every
# deployment environment that imports “production.toml”.
#
# Conventions
#   • Snake-case for keys
#   • All secrets must be supplied via environment variables
#   • TOML comments start with “#”
#
# =======================================================================

#######################################################################
# Environment & Build
#######################################################################
[env]
name                     = "production"
build_id                 = "${CI_COMMIT_SHA:-unknown}"
deployment_region        = "${DEPLOY_REGION:-us-east-1}"

#######################################################################
# Server
#######################################################################
[server]
host                     = "0.0.0.0"
port                     = 8080
# Acceptable values: positive integer, or “auto” to match hardware cores
workers                  = "auto"
keep_alive_seconds       = 75
max_request_bytes        = 10485760     # 10 MiB – large enough for creative payloads
graceful_shutdown_secs   = 25

#######################################################################
# Security & Authentication
#######################################################################
[security]
allowed_origins          = [
  "https://studio.paletteflux.io",
  "https://api.paletteflux.io"
]
allowed_methods          = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
rate_limit_per_minute    = 1200
csrf_protection          = true

[auth]
jwt_secret               = "${JWT_SECRET}"               # 256-bit secret key
jwt_algorithm            = "HS512"
access_token_lifetime_m  = 30
refresh_token_lifetime_d = 14
password_hash_cost       = 12                             # bcrypt cost factor

#######################################################################
# Logging
#######################################################################
[logging]
level                    = "info"                         # trace|debug|info|warn|error|fatal
format                   = "json"                         # json|plain
stdout                   = true
file                     = "/var/log/paletteflux/api_graphql.log"
rotation                 = "daily"
retention_days           = 14
# Correlates request/trace IDs across services
propagate_trace_ids      = true

#######################################################################
# Tracing & Monitoring
#######################################################################
[monitoring]
enabled                  = true
metrics_port             = 9100
metrics_path             = "/metrics"
tracing_backend          = "jaeger"
trace_export_endpoint    = "${JAEGER_ENDPOINT}"
sampling_ratio           = 0.25

[observability]
sentry_dsn               = "${SENTRY_DSN}"
log_sample_rate          = 0.05
traces_sample_rate       = 0.25

#######################################################################
# Database Configuration
#######################################################################
[database]
default_driver           = "postgres"
pool_size                = 30
connection_timeout_ms    = 6000
max_lifetime_minutes     = 30

[database.default]
url                      = "${DATABASE_URL}"
schema_search_path       = "studio,public"

[database.read_replica]
# Optional read-replica used by query handlers
url                      = "${READ_REPLICA_URL}"
pool_size                = 20
use_ssl                  = true
ssl_mode                 = "require"

#######################################################################
# Cache
#######################################################################
[cache]
backend                  = "redis"
ttl_seconds              = 900                            # 15 minutes
read_through             = true
write_through            = true
compress_values          = true

[cache.redis]
url                      = "${REDIS_URL}"
retry_backoff_ms         = 250
max_retries              = 5

#######################################################################
# Messaging Buses
#######################################################################
[services.command_bus]
provider                 = "nats"
subject                  = "paletteflux.command_bus"
url                      = "${NATS_URL}"
connect_timeout_ms       = 2000

[services.event_bus]
provider                 = "nats"
subject                  = "paletteflux.event_bus"
url                      = "${NATS_URL}"
queue_group              = "studio_event_consumers"

#######################################################################
# API Gateways
#######################################################################
[gateways.graphql]
url                      = "/graphql"
introspection_enabled    = false                          # Disable in prod
timeout_ms               = 30000
depth_limit              = 15
complexity_limit         = 200

[gateways.rest]
url                      = "/v1"
timeout_ms               = 15000

#######################################################################
# GraphQL Schema
#######################################################################
[graphql]
schema_path              = "schema/production.graphql"
# If true, /graphql will serve GraphiQL playground even in prod.
playground_enabled       = false

#######################################################################
# REST Configuration
#######################################################################
[rest.pagination]
default_page_size        = 50
max_page_size            = 200

#######################################################################
# Feature Flags
#######################################################################
[feature_flags]
enable_experimental_shaders   = false
enable_asset_version_diffing  = true
enable_streaming_mode         = true
enable_live_collaboration     = false

#######################################################################
# CDN & Asset Pipeline
#######################################################################
[assets]
textures_bucket           = "pf-prod-textures"
audio_bucket              = "pf-prod-audio"
max_texture_resolution    = "8192x8192"
thumbnails_enabled        = true
thumbnail_resolution      = "512x512"
cdn_base_url              = "https://cdn.paletteflux.io"

#######################################################################
# Rate Limiting Policies (per-endpoint overrides)
#######################################################################
[[rate_limits]]
path                       = "/graphql"
limit_per_minute           = 900

[[rate_limits]]
path                       = "/v1/assets/*"
limit_per_minute           = 4500

#######################################################################
# Version Registry
#######################################################################
[versions]
api                        = "1.3.0"
schema                     = "2024-05-15"
assets                     = "2.1.0"

#######################################################################
# Service Discovery / Micro-services
#######################################################################
[services.renderer]
url                        = "${RENDERER_SERVICE_URL}"
healthcheck_path           = "/health"
timeout_ms                 = 120000

[services.thumbnailer]
url                        = "${THUMBNAILER_SERVICE_URL}"
healthcheck_path           = "/health"
timeout_ms                 = 45000

#######################################################################
# Emergency Maintenance Banner
#######################################################################
[maintenance]
enabled                    = false
message                    = "PaletteFlux Studio is undergoing scheduled maintenance. Please try again later."
expected_resolution_utc    = ""

# =======================================================================
# End of production.toml
# =======================================================================