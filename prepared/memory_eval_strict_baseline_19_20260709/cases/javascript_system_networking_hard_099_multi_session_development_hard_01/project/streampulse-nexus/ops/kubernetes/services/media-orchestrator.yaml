```yaml
# ------------------------------------------------------------------------------
#  StreamPulse Nexus – Media Orchestrator
#  Kubernetes spec that wires up the core Media-Orchestrator micro-service.
#
#  Responsibilities
#  • Coordinates packet routing between ingress gateways, edge caches, and
#    transcoding pools.
#  • Publishes health + performance metrics to Prometheus and OpenTelemetry.
#  • Listens for Command-pattern fail-over events to trigger disaster-recovery.
#
#  This manifest ships:
#    1. Namespace isolation (if not already present)
#    2. RBAC (least-privilege)
#    3. ConfigMap + Secret projection
#    4. Deployment with readiness/liveness/startup probes
#    5. ClusterIP Service (HTTP + gRPC)
#    6. HPA (CPU + custom latency metric)
#    7. PodDisruptionBudget for graceful upgrades
# ------------------------------------------------------------------------------

# 1. Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: streampulse
  labels:
    app.kubernetes.io/part-of: streampulse-nexus
    pod-security.kubernetes.io/enforce: "baseline"
---
# 2. RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-orchestrator
  namespace: streampulse
  labels:
    app.kubernetes.io/component: media-orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: media-orchestrator
  namespace: streampulse
rules:
  # Watch ConfigMaps + Secrets for dynamic reload
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  # Emit events for dashboards
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Read pods for load-balancer strategies
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: media-orchestrator
  namespace: streampulse
subjects:
  - kind: ServiceAccount
    name: media-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: media-orchestrator
---
# 3. Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: media-orchestrator-config
  namespace: streampulse
data:
  orchestrator.yml: |
    # ----------------------------------------------------
    #  Dynamic runtime configuration
    # ----------------------------------------------------
    loadBalancer:
      strategy: "audience-heatmap"      # Strategy Pattern
      maxConnectionsPerNode: 15000
    telemetry:
      prometheusPort: 9600
      otlp:
        endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
        samplingRatio: 0.25
    security:
      jwtIssuer: "https://auth.streampulse.io"
      requiredScopes:
        - "stream:read"
        - "stream:write"
    disasterRecovery:
      enabled: true
      retryBackoffSeconds: 5
      maxRetry: 10
---
apiVersion: v1
kind: Secret
metadata:
  name: media-orchestrator-secret
  namespace: streampulse
type: Opaque
stringData:
  REDIS_URL: "rediss://redis-primary.streampulse.svc.cluster.local:6379/0"
  DATABASE_URL: "postgresql://streampulse:$(POSTGRES_PWD)@postgres.streampulse.svc:5432/nexus"
---
# 4. Service
apiVersion: v1
kind: Service
metadata:
  name: media-orchestrator
  namespace: streampulse
  labels:
    app: media-orchestrator
spec:
  type: ClusterIP
  selector:
    app: media-orchestrator
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
---
# 5. Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-orchestrator
  namespace: streampulse
  labels:
    app: media-orchestrator
spec:
  replicas: 4
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: media-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: media-orchestrator
        app.kubernetes.io/version: "1.8.0"
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: media-orchestrator
      terminationGracePeriodSeconds: 30
      containers:
        - name: media-orchestrator
          image: ghcr.io/streampulse/nexus-media-orchestrator:1.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9600
          env:
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: media-orchestrator-secret
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: media-orchestrator-secret
                  key: DATABASE_URL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.streampulse.svc.cluster.local:4317"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: config
              mountPath: /etc/streampulse
              readOnly: true
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: media-orchestrator-config
              - secret:
                  name: media-orchestrator-secret
---
# 6. Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: media-orchestrator
  namespace: streampulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: media-orchestrator
  minReplicas: 2
  maxReplicas: 12
  metrics:
    # Standard CPU utilization metric
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Custom latency metric scraped by Prometheus Adapter
    - type: Pods
      pods:
        metric:
          name: orchestrator_p50_latency_ms
        target:
          type: AverageValue
          averageValue: 120m  # 120 ms
---
# 7. Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: media-orchestrator
  namespace: streampulse
spec:
  minAvailable: 75%
  selector:
    matchLabels:
      app: media-orchestrator
```