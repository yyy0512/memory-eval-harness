# CampusGuard EDU Monitor - System Monitoring Configuration File
# ---------------------------------------------------------------------------
# This file defines global and component-level settings for CampusGuard EDU
# Monitor.  Parameters are grouped in logical sections.  Unless otherwise
# noted, changes take effect on the next daemon reload (`cgmonctl reload`).
#
# Syntax:
#   - Key/value pairs use the format:  key = value
#   - Lines beginning with '#' are comments.
#   - Section headers are written as [section].
#   - Multivalued keys may be repeated or separated by comma.
#
# ---------------------------------------------------------------------------
# FILE VERSIONING
# ---------------------------------------------------------------------------
# The config_version is *mandatory* and ensures compatibility between
# the running binary and configuration schema.  Do not modify unless
# you are upgrading the daemon.
#
config_version = 1.3

# ---------------------------------------------------------------------------
# [general]
# ---------------------------------------------------------------------------
[general]
# Unique identifier for this CampusGuard deployment, appears in logs
# and is used to partition data in the database.
instance_id = cs-lab-monitor-01

# Hostname/IP on which the core daemon listens for local component RPC.
# Use 0.0.0.0 to bind to all interfaces.
bind_address = 127.0.0.1

# Default port for the internal REST Gateway consumed by UI dashboards.
rest_port = 9080

# Number of worker threads in the Event-Driven message bus.
# Should not exceed logical CPU cores * 4.
worker_threads = 8

# Time (in seconds) the master process waits before attempting a
# clean shutdown after receiving SIGTERM.
graceful_shutdown_timeout = 20

# ---------------------------------------------------------------------------
# [logging]
# ---------------------------------------------------------------------------
[logging]
# Logging level for the core daemon.
# Valid values: TRACE, DEBUG, INFO, WARN, ERROR.
level = INFO

# Directory where log files are written.
log_dir = /var/log/campusguard

# Maximum size (in MiB) for individual log files before rotation.
max_size_mb = 50

# Maximum number of rotated log files to keep per category.
rotate_count = 10

# If "yes", logs are mirrored to syslog using facility "local5".
mirror_to_syslog = yes

# ---------------------------------------------------------------------------
# [database]
# ---------------------------------------------------------------------------
[database]
# Path to SQLite database file.  Must be writable by the daemon user.
sqlite_path = /var/lib/campusguard/monitor.db

# Set "journal_mode" to WAL for high-concurrency labs.
journal_mode = WAL

# Automatic DB compaction (VACUUM) schedule in crontab-like format.
# Default: 03:15 every Sunday.
auto_vacuum_cron = 15 3 * * 0

# ---------------------------------------------------------------------------
# [security_scanner]
# ---------------------------------------------------------------------------
[security_scanner]
# Enable or disable the built-in vulnerability/security scanner.
enabled = yes

# Default scan profile.  Profiles are defined under
# /etc/campusguard/scan-profiles.d/
default_profile = edu-baseline.yml

# Cron-style schedule for automatic scans (UTC).
# Daily at 01:00 -> 0 1 * * *
schedule = 0 1 * * *

# Maximum simultaneous scans across the service mesh.
concurrency = 4

# ---------------------------------------------------------------------------
# [backup]
# ---------------------------------------------------------------------------
[backup]
# Global toggle for backup functionality.
enabled = yes

# Root directory where snapshots are stored.
snapshot_root = /mnt/backups/campusguard

# Retention policy (in days) for full snapshots.
full_retention_days = 30

# Retention policy (in days) for incremental snapshots.
incremental_retention_days = 7

# Hour (24h) to perform daily incremental backups.
incremental_hour = 2

# Day of week (0-6, 0 = Sunday) to perform full backup.
full_backup_dow = 6

# ---------------------------------------------------------------------------
# [alerting]
# ---------------------------------------------------------------------------
[alerting]
# Master switch for alerting subsystem.
enabled = yes

# Comma-separated list of e-mail recipients for critical alerts.
email_recipients = noc@university.edu, cs-faculty@university.edu

# SMTP server used to dispatch e-mail notifications.
smtp_server = smtp.university.edu

# TCP port for SMTP server.
smtp_port = 587

# TLS requirement: none, starttls, or smtps
smtp_security = starttls

# Username/password for SMTP authentication.
smtp_user = campusguard
smtp_password = secret-change-me

# Minimum severity that triggers an e-mail (INFO, WARN, ERROR, CRITICAL).
email_min_severity = WARN

# Integration token for Slack notifications (optional).
slack_webhook_url = https://hooks.slack.com/services/T000/B000/XXXX

# ---------------------------------------------------------------------------
# [agents]
# ---------------------------------------------------------------------------
[agents]
# Default port micro-agents listen on within the lab VLAN.
agent_port = 9100

# Expected agent version; mismatches raise a WARN event.
expected_version = 2.5

# Heartbeat interval (seconds) for liveness checks.
heartbeat_interval = 15

# Max seconds without heartbeat before agent is marked "DOWN".
heartbeat_timeout = 60

# ---------------------------------------------------------------------------
# [feature_flags]
# ---------------------------------------------------------------------------
[feature_flags]
# Enable the experimental Prometheus exporter (beta).
prometheus_exporter = off

# Toggle GraphQL playground endpoint for the REST gateway.
graphql_playground = off

# ---------------------------------------------------------------------------
# [advanced]
# ---------------------------------------------------------------------------
[advanced]
# Path to custom Lua scripts for on-the-fly metric aggregation.
lua_scripts_path = /etc/campusguard/lua

# Maximum time (milliseconds) a Lua script may execute.
lua_script_timeout_ms = 800

# Internal TLS settings for inter-component gRPC.
# Certificate authority bundle.
grpc_ca_file = /etc/campusguard/certs/ca.pem
# Certificate + private key presented by the daemon.
grpc_cert_file = /etc/campusguard/certs/daemon.crt
grpc_key_file = /etc/campusguard/certs/daemon.key
# Require clients to present certs.
grpc_require_client_cert = yes

# ---------------------------------------------------------------------------
# END OF FILE
# ---------------------------------------------------------------------------