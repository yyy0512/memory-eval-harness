/*
 * RetinaGuard Vision Suite
 * ---------------------------------------------------------------------------
 * config/models.conf
 *
 * This file provides a compile-time declaration of all deep-learning models
 * bundled with the RetinaGuard executable.  Expressing the configuration in
 * C eliminates the need for a runtime parser, which keeps the trusted
 * computing base small and predictable for medical-device certification.
 *
 * NOTE:
 *   • This header is intended to be #included by multiple translation units.
 *     All symbols are therefore declared 'static' to prevent duplicate
 *     definitions at link time.
 *   • The configuration is immutable; no mutating APIs are exposed.
 *
 * ---------------------------------------------------------------------------
 * Copyright (c) 2024  RetinaGuard Project
 * SPDX-License-Identifier: MIT
 */

#ifndef RETINA_MODELS_CONF_H
#define RETINA_MODELS_CONF_H

#ifdef __cplusplus
extern "C" {
#endif

#include <stddef.h>   /* size_t   */
#include <string.h>   /* strcmp() */

/* =========================================================================
 * Data Structures
 * ========================================================================= */

/* Centralised description of a model artefact shipped with RetinaGuard */
typedef struct retina_model_conf {
    const char *model_id;     /* Unique logical handle (used by registry)     */
    const char *file_path;    /* Absolute path to the ONNX/TFLite weight file */
    const char *architecture; /* High-level CNN/Transformer architecture      */
    const char *version;      /* SemVer-compatible version string             */
    const char *checksum;     /* sha256 digest for tamper detection           */

    /* Normalisation parameters used during training */
    double       input_mean;  /* Channel-wise mean                            */
    double       input_std;   /* Channel-wise std-dev                         */

    /* Inference hyper-parameters */
    double       threshold;   /* Probability threshold for positive class     */

    /* Expected input tensor shape */
    size_t       input_width; /* Width  in pixels                             */
    size_t       input_height;/* Height in pixels                             */
} retina_model_conf_t;

/* ------------------------------------------------------------------------- */
/* Helper macro to keep the declaration table succinct                      */
/* ------------------------------------------------------------------------- */
#define RETINA_MODEL(id, path, arch, ver, checksum, mean, std, thr, w, h) \
    { id, path, arch, ver, checksum, mean, std, thr, w, h }

/* =========================================================================
 * Compile-time Model Catalogue
 * =========================================================================
 * The first entry is considered the production model currently serving
 * patient data.  Subsequent entries may be used for canary deployments,
 * A/B testing, or regression validation.
 */
static const retina_model_conf_t g_retina_models[] = {
    RETINA_MODEL(
        "dr_grader_primary",
        "/opt/retinaguard/models/dr_grader_primary.onnx",
        "EfficientNet-B5",
        "2024.2.1",
        "sha256:1f3b6a54c9b330d700be42b5bd7ee5d05d2c9b7d0d8c6e8f3b9f2a1c4d327e9",
        /* stats   */ 0.485, 0.229,
        /* thresh  */ 0.35,
        /* shape   */ 456, 456
    ),

    RETINA_MODEL(
        "dr_grader_candidate",
        "/opt/retinaguard/models/dr_grader_candidate.onnx",
        "ConvNeXt-Base",
        "2024.2.3-beta",
        "sha256:4db8d92c384e5cd422b30a7e9d22e645adf55925595c4b983d3e4e84223cb3b2",
        0.485, 0.229,
        0.37,
        512, 512
    ),

    RETINA_MODEL(
        "dr_grader_baseline",
        "/opt/retinaguard/models/dr_grader_baseline.onnx",
        "ResNet50",
        "2023.4.0",
        "sha256:98ce3d4d2984fef12ac7b3a3c2d45c83d2e4ab7183f6c9863144e5b2a47a13d1",
        0.485, 0.229,
        0.30,
        448, 448
    )
};

/* Total number of model configurations compiled in */
static const size_t g_retina_models_count =
    sizeof(g_retina_models) / sizeof(g_retina_models[0]);

/* =========================================================================
 * Public Helper APIs (header-only, inline)
 * ========================================================================= */

/* Number of bundled model configurations */
static inline size_t
retina_models_count(void)
{
    return g_retina_models_count;
}

/*
 * Fetch a model configuration by zero-based index.
 *
 * Returns NULL if 'index' is out of range.
 */
static inline const retina_model_conf_t *
retina_get_model_conf(size_t index)
{
    return (index < g_retina_models_count) ? &g_retina_models[index] : NULL;
}

/*
 * Lookup a model configuration by its logical id.
 *
 * Returns NULL if the id is not found or if 'model_id' is NULL.
 */
static inline const retina_model_conf_t *
retina_find_model_conf(const char *model_id)
{
    if (model_id == NULL) {
        return NULL;
    }

    for (size_t i = 0; i < g_retina_models_count; ++i) {
        if (strcmp(g_retina_models[i].model_id, model_id) == 0) {
            return &g_retina_models[i];
        }
    }
    return NULL;
}

/*
 * Convenience accessor for the current production model (index 0).
 */
static inline const retina_model_conf_t *
retina_primary_model_conf(void)
{
    return &g_retina_models[0];
}

#ifdef __cplusplus
} /* extern "C" */
#endif

#endif /* RETINA_MODELS_CONF_H */