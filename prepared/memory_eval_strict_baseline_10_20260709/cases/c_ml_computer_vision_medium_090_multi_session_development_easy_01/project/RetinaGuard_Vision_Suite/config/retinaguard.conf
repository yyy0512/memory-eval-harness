# RetinaGuard Vision Suite – Master Configuration
# File: RetinaGuard_Vision_Suite/config/retinaguard.conf
# ---------------------------------------------------------------------------
# This INI-style configuration file controls the behaviour of the monolithic
# RetinaGuard executable.  All parameters are hot-reloadable unless explicitly
# documented otherwise (†).  Values are tuned for a typical primary-care clinic
# workstation (8-core CPU, 1 × mid-range GPU, 16 GB RAM).  Tweak with caution.
# ---------------------------------------------------------------------------

##############################################################################
# CORE PIPELINE
##############################################################################
[pipeline]
# Ordered list of pipeline stages invoked for each image.
stages                 = ingest,quality_control,preprocess,feature_extract,\
                         inference,evaluation,visualization,emr_feedback
max_batch_size         = 8                 # Upper bound per inference pass.
worker_threads         = 4                 # Thread pool size for CPU stages.
# If true, pipeline halts on first critical error; otherwise continues w/ warn.
fail_fast              = true
# Time in seconds before an idle pipeline auto-suspends resources (†)
idle_timeout_sec       = 300

##############################################################################
# FILESYSTEM PATHS
##############################################################################
[paths]
data_dir               = /var/lib/retinaguard/data          # Image archive
model_dir              = /opt/retinaguard/models            # Deployed models
log_dir                = /var/log/retinaguard               # App logs
temp_dir               = /var/cache/retinaguard             # Scratch space
export_dir             = /var/lib/retinaguard/exports       # CSV/PDF exports

##############################################################################
# IMAGE INGESTION & QC
##############################################################################
[image_ingest]
accepted_formats       = jpg,jpeg,png,tiff
max_resolution         = 6000x6000            # Absolute hard-cap
min_resolution         = 1024x1024            # QC failure below this
quality_threshold      = 0.75                 # 0-1 heuristic sharpness score
duplicate_hash_window  = 90d                  # Reject near-duplicate within N

##############################################################################
# PRE-PROCESSING (CPU)
##############################################################################
[preprocess]
clahe_clip_limit       = 2.0                  # CLAHE contrast clip limit
clahe_tile_grid        = 8x8
illumination_correct   = true
crop_margin_px         = 50                   # Trim black border
color_normalization    = per_channel_zscore

##############################################################################
# DOMAIN-SPECIFIC FEATURE ENGINEERING
##############################################################################
[feature_engineering]
generate_heatmaps      = true
heatmap_sigma          = 1.5
microaneurysm_window   = 15
hard_exudate_window    = 25
vessel_segmentation    = true
optic_disk_mask        = true

##############################################################################
# MODEL INFERENCE (GPU)
##############################################################################
[inference]
model_name             = dr_grading_cnn
model_version          = 1.4.2
device                 = gpu                  # {gpu|cpu|auto}
gpu_id                 = 0
inference_timeout_ms   = 5000
# If true, engine falls back to CPU after 3 consecutive GPU failures.
enable_gpu_failover    = true
precision              = fp16                 # {fp32|fp16|int8}

##############################################################################
# CLINICAL RISK EVALUATION
##############################################################################
[evaluation]
risk_threshold_mild        = 0.15
risk_threshold_moderate    = 0.35
risk_threshold_severe      = 0.55
blindness_risk_threshold   = 0.75
confidence_interval        = 0.95
# Automatically trigger “progression” flag if risk increases by ≥ delta.
progression_delta          = 0.10

##############################################################################
# REAL-TIME MONITORING & ALERTING
##############################################################################
[monitoring]
prometheus_port        = 9091
dashboard_refresh_sec  = 10
alert_progression_delta= 0.1
alert_email            = alerts@retinaguard.local
enable_syslog          = true
max_alerts_per_hour    = 20

##############################################################################
# MLOPS – ON-DEVICE RETRAINING & VERSIONING
##############################################################################
[mlops]
scheduled_retraining   = true
retraining_cron        = */90 * * * *        # Every 90 minutes (if idle)
validation_split       = 0.2
max_training_epochs    = 50
early_stopping_patience= 5
model_registry_url     = unix:///var/run/retinaguard/registry.sock

##############################################################################
# INTERNAL SQLITE DATABASE
##############################################################################
[database]
type                   = sqlite
path                   = /var/lib/retinaguard/retinaguard.db
backup_rotation_days   = 7
stats_ttl_days         = 365
busy_timeout_ms        = 3000

##############################################################################
# OBSERVER PATTERN – IN-PROCESS EVENT BUS
##############################################################################
[observer]
enable_model_registry  = true
model_registry_socket  = /var/run/retinaguard/registry.sock
event_buffer_size      = 1024
# If queue is full, drop_policy = {block|drop_oldest|drop_newest}
drop_policy            = drop_oldest

##############################################################################
# SECURITY & PRIVACY
##############################################################################
[security]
enable_audit_logging   = true
audit_log_path         = /var/log/retinaguard/audit.log
mask_phis              = true
allowed_ips            = 192.168.0.0/16,10.0.0.0/8
process_isolation      = seccomp
tls_private_key        = /etc/retinaguard/certs/server.key
tls_certificate        = /etc/retinaguard/certs/server.crt

##############################################################################
# TELEMETRY & TRACING
##############################################################################
[telemetry]
enable_metrics         = true
metrics_endpoint       = http://localhost:9091/metrics
enable_tracing         = true
tracing_backend        = zipkin
tracing_endpoint       = http://localhost:9411/api/v2/spans
sample_rate            = 0.05                 # 5 % of requests

##############################################################################
# APPLICATION LOGGING
##############################################################################
[logging]
level                  = INFO                # {DEBUG|INFO|WARN|ERROR}
file                   = /var/log/retinaguard/retinaguard.log
rotate_size_mb         = 50
rotate_backups         = 5
json_format            = false               # Set true for structured logs

##############################################################################
# PERFORMANCE BENCHMARKS (BASELINE)
##############################################################################
[benchmark]
baseline_throughput    = 20                  # images per minute
baseline_latency_ms    = 120                 # p95 one-way latency

##############################################################################
# EMR (HL7/FHIR) INTEGRATION
##############################################################################
[emr_integration]
hl7_endpoint           = localhost:2575
timeout_ms             = 3000
retry_attempts         = 3
enable_fhir_push       = true
fhir_server_url        = http://localhost:8080/fhir

##############################################################################
# END OF FILE
##############################################################################