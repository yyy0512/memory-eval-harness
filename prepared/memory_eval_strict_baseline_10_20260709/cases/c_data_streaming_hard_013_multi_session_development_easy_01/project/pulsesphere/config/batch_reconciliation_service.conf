```ini
###############################################################################
#  PulseSphere – Real-Time Social Pulse Streaming Platform
#  ----------------------------------------------------------------------------
#  Batch Reconciliation Service – Runtime Configuration
#
#  This configuration file controls the behaviour of the fault-tolerant batch
#  reconciliation micro-service that (re)orders, deduplicates, and reconciles
#  late-arriving / out-of-order “pulse” events prior to downstream aggregation.
#
#  File Path : pulsesphere/config/batch_reconciliation_service.conf
#  Format    : INI-style key/value pairs with section headers
#  Encoding  : UTF-8
#
#  NOTE:
#    1. Environment variable substitution is supported using the syntax
#       ${ENV_VAR_NAME}. Missing variables will cause startup failure.
#    2. Lines beginning with ‘#’ or ‘;’ are treated as comments.
###############################################################################

###############################################################################
# Service Identity & Lifecycle
###############################################################################
[service]
# Unique service instance identifier. Can be overridden via CLI flag ‑-instance-id
instance_id           = brs-${HOSTNAME}
service_name          = batch-reconciliation-service
enabled               = true

# The coordinator uses this epoch to decide whether checkpoint state has to be
# discarded when a rollout occurs (e.g., `epoch` bump forces a cold start).
epoch                 = 3

# By default the service listens on all interfaces. Bind to 127.0.0.1 for local
# development or when fronted by a reverse proxy.
listen_addr           = 0.0.0.0
listen_port           = 7512

###############################################################################
# Input / Output Streams
###############################################################################
[streams]
# Comma-separated list of input Kafka topics that carry raw social pulse events
input_topics          = raw-pulses-v1, raw-pulses-late-bucket

# Output topic to which reconciled, temporally ordered events are published
output_topic          = curated-pulses-v1

# Consumer group ID used for committing offsets
consumer_group_id     = brs-consumer-group

# Max bytes fetched in a single poll (tune for throughput vs. memory)
fetch_max_bytes       = 16MiB

###############################################################################
# Batch Window & Reconciliation Strategy
###############################################################################
[batch_window]
# Time interval (in milliseconds) over which pulses are bucketed
window_size_ms        = 30000          ; 30 seconds

# Additional grace period to wait for late events before finalising a window
grace_period_ms       = 10000          ; 10 seconds

# Maximum allowed clock skew between event time and ingestion time
max_allowed_lateness_ms = 600000       ; 10 minutes

# Strategy used for handling out-of-order events:
#   - drop        : discard if outside the grace period
#   - reroute     : send to a dead-letter topic
#   - quarantine  : write to quarantine storage (requires quarantine.* section)
lateness_strategy     = reroute

###############################################################################
# Deduplication Settings
###############################################################################
[deduplication]
# Sliding bloom filter parameters
bloom_expected_insertions = 500000
bloom_false_positive_rate = 0.0001

# How long to keep deduplication state in memory before eviction
state_ttl_ms              = 3600000      ; 1 hour

###############################################################################
# State Backend & Checkpointing
###############################################################################
[storage]
# RockDB state backend directory (must be writeable)
state_dir              = ${PULSESPHERE_DATA_DIR}/brs/state

# Snapshot directory for periodic checkpoints
checkpoint_dir         = ${PULSESPHERE_DATA_DIR}/brs/checkpoints

# Checkpoint frequency (ms). Set to 0 to disable.
checkpoint_interval_ms = 120000         ; 2 minutes

# Maximum number of retained checkpoints
checkpoint_retention   = 5

###############################################################################
# Retry & Backoff Policy
###############################################################################
[retry_policy]
max_retries            = 5
initial_delay_ms       = 500
max_delay_ms           = 30000
backoff_multiplier     = 2.0             ; Exponential backoff factor

###############################################################################
# Plugin System – Dynamic Enrichment & Validation
###############################################################################
[plugins]
# Shared library search path(s) separated by ‘:’. Libraries must export
# `PulsePlugin* pulsesphere_plugin_init(void)`
search_paths           = /usr/local/lib/pulsesphere/plugins:/opt/pulsesphere/plugins

# Ordered list of reconciliation plugins enabled for this service
enabled_plugins        = \
    geo_corrector.so, \
    temporal_realigner.so, \
    toxicity_adjuster.so

# Plugin initialisation timeout (ms). Prevents a hung plugin from blocking boot.
init_timeout_ms        = 3000

###############################################################################
# Quarantine Destination (if `lateness_strategy = quarantine`)
###############################################################################
[quarantine]
# S3-compatible object storage bucket & prefix
bucket                 = pulsesphere-quarantine
prefix                 = brs/${instance_id}/

# Retention period for quarantined objects
retention_days         = 14

###############################################################################
# Observability – Logging & Metrics
###############################################################################
[logging]
# Valid levels: TRACE, DEBUG, INFO, WARN, ERROR, FATAL
level                  = INFO

# Output can be ‘stdout’, ‘stderr’, or an absolute path to a log file
output                 = /var/log/pulsesphere/brs.log

# Log rotation parameters (if ‘output’ is a file)
rotation_size_mb       = 100
rotation_keep_files    = 7
rotation_compress      = true

[metrics]
# StatsD / Telegraf UDP endpoint for metric emission
statsd_host            = ${PULSESPHERE_STATSD_HOST:-localhost}
statsd_port            = 8125

# Toggle high-cardinality label reporting
enable_high_card_labels = false

###############################################################################
# Security & TLS
###############################################################################
[tls]
# Enable TLS for Kafka & HTTP (set to ‘false’ for local dev only!)
enabled                = true

# Path to PEM-encoded certificate & key files
cert_file              = /etc/pulsesphere/certs/brs.pem
key_file               = /etc/pulsesphere/certs/brs-key.pem

# CA bundle for client authentication (optional)
ca_file                = /etc/pulsesphere/certs/ca_bundle.pem

# Whether to verify broker certificates
verify_peer            = true

###############################################################################
# End-of-File
###############################################################################
```