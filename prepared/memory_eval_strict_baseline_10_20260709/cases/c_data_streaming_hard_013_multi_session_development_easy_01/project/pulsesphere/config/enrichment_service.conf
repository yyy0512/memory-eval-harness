/*
 *  PulseSphere - Real-Time Social Pulse Streaming Platform
 *  -------------------------------------------------------
 *  File:     pulsesphere/config/enrichment_service.conf
 *  Purpose:  Compile-time + runtime configuration interface for the
 *            Enrichment Service.  This file is *intended* to be
 *            #include-d from C/C++ translation units.
 *
 *            The configuration is initialised with sensible defaults,
 *            then selectively overridden through environment variables.
 *
 *            Example:
 *                #include "pulsesphere/config/enrichment_service.conf"
 *
 *            Compile command (snippet):
 *                gcc -std=c11 -I./ -c my_enrichment.c
 *
 *  Language: C11
 *  --------------------------------------------------------------------
 */

#ifndef PULSESHPERE_ENRICHMENT_SERVICE_CONF
#define PULSESHPERE_ENRICHMENT_SERVICE_CONF

/* ------------------------------------------------------------------ */
/*                           Dependencies                              */
/* ------------------------------------------------------------------ */
#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include <stdint.h>
#include <limits.h>
#include <inttypes.h>
#include <errno.h>
#include <ctype.h>

/* ------------------------------------------------------------------ */
/*                         Versioning Macros                           */
/* ------------------------------------------------------------------ */
#define ES_CONF_API_MAJOR        1
#define ES_CONF_API_MINOR        0
#define ES_CONF_API_PATCH        3

#define ES_CONF_VERSION_STRING  "1.0.3"

/* ------------------------------------------------------------------ */
/*                          Default Settings                           */
/* ------------------------------------------------------------------ */
#define ES_DEFAULT_WORKERS                8u
#define ES_MAX_WORKERS                    64u

#define ES_DEFAULT_PLUGIN_DIR             "/etc/pulsesphere/enrichment/plugins"
#define ES_PLUGIN_EXTENSION               ".so"

#define ES_DEFAULT_GEO_DB_PATH            "/var/lib/pulsesphere/geoip/GeoLite2-City.mmdb"
#define ES_DEFAULT_LANG_MODEL_PATH        "/var/lib/pulsesphere/langdetect.bin"
#define ES_DEFAULT_TOX_MODEL_PATH         "/var/lib/pulsesphere/toxicity.onnx"

#define ES_DEFAULT_KAFKA_BROKERS          "kafka-1:9092,kafka-2:9092,kafka-3:9092"
#define ES_DEFAULT_KAFKA_GROUP_ID         "pulse-enrichment-v1"
#define ES_DEFAULT_KAFKA_PULSE_TOPIC      "ps.raw_pulses"
#define ES_DEFAULT_KAFKA_ENRICH_TOPIC     "ps.enriched_pulses"

#define ES_DEFAULT_EVENT_BUFFER_SIZE      (1u << 16)   /* 65,536 events  */
#define ES_DEFAULT_EVENT_MAX_SIZE         2048u        /*     2 KiB      */

#define ES_DEFAULT_LATE_EVENT_WIN_MS      300000u      /* 5 minutes      */
#define ES_DEFAULT_METRICS_FLUSH_SEC      10u

#define ES_DEFAULT_BP_SOFT_THRESH         70u          /* percent        */
#define ES_DEFAULT_BP_HARD_THRESH         90u

#define ES_DEFAULT_TLS_ENABLE             1
#define ES_DEFAULT_TLS_CERT_PATH          "/etc/pulsesphere/certs/enrichment.crt"
#define ES_DEFAULT_TLS_KEY_PATH           "/etc/pulsesphere/certs/enrichment.key"
#define ES_DEFAULT_TLS_CA_PATH            "/etc/pulsesphere/certs/ca.crt"

#define ES_DEFAULT_LOG_LEVEL              3            /* 0-trace .. 5-fatal */
#define ES_DEFAULT_LOG_FILE               "/var/log/pulsesphere/enrichment_service.log"
#define ES_DEFAULT_LOG_ROT_MB             128u
#define ES_DEFAULT_LOG_ROT_BACKUPS        5u

#define ES_DEFAULT_HEALTH_PORT            9070u
#define ES_DEFAULT_HEALTH_BIND_ADDR       "0.0.0.0"

#define ES_DEFAULT_SHUTDOWN_GRACE_SEC     30u

/* ------------------------------------------------------------------ */
/*                        Configuration Structure                      */
/* ------------------------------------------------------------------ */

typedef struct es_conf {
    /* Worker & plugin settings */
    unsigned             worker_count;
    char                 plugin_dir[PATH_MAX];

    /* Enrichment resources */
    char                 geo_db_path[PATH_MAX];
    char                 lang_model_path[PATH_MAX];
    char                 tox_model_path[PATH_MAX];

    /* Kafka / event streaming */
    char                 kafka_brokers[512];
    char                 kafka_group_id[128];
    char                 kafka_pulse_topic[128];
    char                 kafka_enrich_topic[128];

    /* Buffering & windowing */
    uint32_t             event_buffer_size;
    uint32_t             event_max_size;
    uint32_t             late_event_window_ms;
    uint32_t             metrics_flush_interval_sec;

    /* Back-pressure */
    uint8_t              bp_soft_threshold;
    uint8_t              bp_hard_threshold;

    /* TLS / security */
    uint8_t              tls_enable;
    char                 tls_cert_path[PATH_MAX];
    char                 tls_key_path[PATH_MAX];
    char                 tls_ca_path[PATH_MAX];

    /* Logging */
    uint8_t              log_level;
    char                 log_file[PATH_MAX];
    uint32_t             log_rotate_mb;
    uint32_t             log_rotate_backups;

    /* Health-check */
    uint16_t             health_port;
    char                 health_bind_addr[64];

    /* Shutdown behaviour */
    uint32_t             shutdown_graceful_timeout_sec;

} es_conf_t;

/* ------------------------------------------------------------------ */
/*                    Internal helper: string copy                      */
/* ------------------------------------------------------------------ */

/* Safely copy src into dest, truncating if necessary and guaranteeing
 * NUL-termination.  Returns 0 on success, -1 if truncated.            */
static inline int
es_strlcpy(char *dest, const char *src, size_t dest_sz)
{
    if (!dest || !src || dest_sz == 0)
        return -1;

    size_t len = strnlen(src, dest_sz);
    if (len >= dest_sz) {
        dest[dest_sz - 1] = '\0';
        return -1;  /* truncated */
    }
    memcpy(dest, src, len + 1);
    return 0;
}

/* ------------------------------------------------------------------ */
/*                Initialise configuration with defaults               */
/* ------------------------------------------------------------------ */

static inline void
es_conf_init_defaults(es_conf_t *c)
{
    if (!c) return;

    memset(c, 0, sizeof(*c));

    c->worker_count               = ES_DEFAULT_WORKERS;
    es_strlcpy(c->plugin_dir,      ES_DEFAULT_PLUGIN_DIR,       sizeof(c->plugin_dir));

    es_strlcpy(c->geo_db_path,     ES_DEFAULT_GEO_DB_PATH,      sizeof(c->geo_db_path));
    es_strlcpy(c->lang_model_path, ES_DEFAULT_LANG_MODEL_PATH,  sizeof(c->lang_model_path));
    es_strlcpy(c->tox_model_path,  ES_DEFAULT_TOX_MODEL_PATH,   sizeof(c->tox_model_path));

    es_strlcpy(c->kafka_brokers,   ES_DEFAULT_KAFKA_BROKERS,    sizeof(c->kafka_brokers));
    es_strlcpy(c->kafka_group_id,  ES_DEFAULT_KAFKA_GROUP_ID,   sizeof(c->kafka_group_id));
    es_strlcpy(c->kafka_pulse_topic, ES_DEFAULT_KAFKA_PULSE_TOPIC, sizeof(c->kafka_pulse_topic));
    es_strlcpy(c->kafka_enrich_topic, ES_DEFAULT_KAFKA_ENRICH_TOPIC, sizeof(c->kafka_enrich_topic));

    c->event_buffer_size          = ES_DEFAULT_EVENT_BUFFER_SIZE;
    c->event_max_size             = ES_DEFAULT_EVENT_MAX_SIZE;
    c->late_event_window_ms       = ES_DEFAULT_LATE_EVENT_WIN_MS;
    c->metrics_flush_interval_sec = ES_DEFAULT_METRICS_FLUSH_SEC;

    c->bp_soft_threshold          = ES_DEFAULT_BP_SOFT_THRESH;
    c->bp_hard_threshold          = ES_DEFAULT_BP_HARD_THRESH;

    c->tls_enable                 = ES_DEFAULT_TLS_ENABLE;
    es_strlcpy(c->tls_cert_path,   ES_DEFAULT_TLS_CERT_PATH,    sizeof(c->tls_cert_path));
    es_strlcpy(c->tls_key_path,    ES_DEFAULT_TLS_KEY_PATH,     sizeof(c->tls_key_path));
    es_strlcpy(c->tls_ca_path,     ES_DEFAULT_TLS_CA_PATH,      sizeof(c->tls_ca_path));

    c->log_level                  = ES_DEFAULT_LOG_LEVEL;
    es_strlcpy(c->log_file,        ES_DEFAULT_LOG_FILE,         sizeof(c->log_file));
    c->log_rotate_mb              = ES_DEFAULT_LOG_ROT_MB;
    c->log_rotate_backups         = ES_DEFAULT_LOG_ROT_BACKUPS;

    c->health_port                = ES_DEFAULT_HEALTH_PORT;
    es_strlcpy(c->health_bind_addr, ES_DEFAULT_HEALTH_BIND_ADDR, sizeof(c->health_bind_addr));

    c->shutdown_graceful_timeout_sec = ES_DEFAULT_SHUTDOWN_GRACE_SEC;
}

/* ------------------------------------------------------------------ */
/*             Utility: parse positive integer from string             */
/* ------------------------------------------------------------------ */

static inline int
es_parse_uint(const char *str, unsigned long max, unsigned long *out)
{
    if (!str || !*str) return -1;

    char *endptr = NULL;
    errno = 0;
    unsigned long val = strtoul(str, &endptr, 10);

    if (errno || endptr == str || *endptr != '\0' || val > max)
        return -1;

    *out = val;
    return 0;
}

/* ------------------------------------------------------------------ */
/*          Override defaults with environment variable values         */
/* ------------------------------------------------------------------ */

static inline void
es_conf_override_from_env(es_conf_t *c)
{
    if (!c) return;

    const struct {
        const char *env_key;
        void       (*apply)(es_conf_t *, const char *);
    } table[] = {
        /* Worker / plugin dir */
        { "PS_ENRICH_WORKERS",        [](es_conf_t *conf, const char *val){
                                            unsigned long v;
                                            if (!es_parse_uint(val, ES_MAX_WORKERS, &v))
                                                conf->worker_count = (unsigned)v;
                                       }},
        { "PS_ENRICH_PLUGIN_DIR",     [](es_conf_t *conf, const char *val){
                                            es_strlcpy(conf->plugin_dir, val, sizeof(conf->plugin_dir));
                                       }},

        /* Resource paths */
        { "PS_ENRICH_GEO_DB",         [](es_conf_t *conf, const char *val){
                                            es_strlcpy(conf->geo_db_path, val, sizeof(conf->geo_db_path));
                                       }},
        { "PS_ENRICH_LANG_MODEL",     [](es_conf_t *conf, const char *val){
                                            es_strlcpy(conf->lang_model_path, val, sizeof(conf->lang_model_path));
                                       }},
        { "PS_ENRICH_TOX_MODEL",      [](es_conf_t *conf, const char *val){
                                            es_strlcpy(conf->tox_model_path, val, sizeof(conf->tox_model_path));
                                       }},

        /* Kafka */
        { "PS_ENRICH_KAFKA_BROKERS",  [](es_conf_t *conf, const char *val){
                                            es_strlcpy(conf->kafka_brokers, val, sizeof(conf->kafka_brokers));
                                       }},
        { "PS_ENRICH_KAFKA_GROUP_ID", [](es_conf_t *conf, const char *val){
                                            es_strlcpy(conf->kafka_group_id, val, sizeof(conf->kafka_group_id));
                                       }},
        { "PS_ENRICH_PULSE_TOPIC",    [](es_conf_t *conf, const char *val){
                                            es_strlcpy(conf->kafka_pulse_topic, val, sizeof(conf->kafka_pulse_topic));
                                       }},
        { "PS_ENRICH_ENRICH_TOPIC",   [](es_conf_t *conf, const char *val){
                                            es_strlcpy(conf->kafka_enrich_topic, val, sizeof(conf->kafka_enrich_topic));
                                       }},

        /* Buffer / window / metrics */
        { "PS_ENRICH_BUF_SIZE",       [](es_conf_t *conf, const char *val){
                                            unsigned long v;
                                            if (!es_parse_uint(val, 1u<<20, &v))
                                                conf->event_buffer_size = (uint32_t)v;
                                       }},
        { "PS_ENRICH_EVENT_MAX",      [](es_conf_t *conf, const char *val){
                                            unsigned long v;
                                            if (!es_parse_uint(val, 65536u, &v))
                                                conf->event_max_size = (uint32_t)v;
                                       }},
        { "PS_ENRICH_LATE_WIN_MS",    [](es_conf_t *conf, const char *val){
                                            unsigned long v;
                                            if (!es_parse_uint(val, 3600000u, &v))
                                                conf->late_event_window_ms = (uint32_t)v;
                                       }},
        { "PS_ENRICH_METRICS_SEC",    [](es_conf_t *conf, const char *val){
                                            unsigned long v;
                                            if (!es_parse_uint(val, 3600u, &v))
                                                conf->metrics_flush_interval_sec = (uint32_t)v;
                                       }},

        /* TLS */
        { "PS_ENRICH_TLS_ENABLE",     [](es_conf_t *conf, const char *val){
                                            conf->tls_enable = (uint8_t)(!!atoi(val));
                                       }},
        { "PS_ENRICH_TLS_CERT",       [](es_conf_t *conf, const char *val){
                                            es_strlcpy(conf->tls_cert_path, val, sizeof(conf->tls_cert_path));
                                       }},
        { "PS_ENRICH_TLS_KEY",        [](es_conf_t *conf, const char *val){
                                            es_strlcpy(conf->tls_key_path, val, sizeof(conf->tls_key_path));
                                       }},
        { "PS_ENRICH_TLS_CA",         [](es_conf_t *conf, const char *val){
                                            es_strlcpy(conf->tls_ca_path, val, sizeof(conf->tls_ca_path));
                                       }},

        /* Logging */
        { "PS_ENRICH_LOG_LEVEL",      [](es_conf_t *conf, const char *val){
                                            unsigned long v;
                                            if (!es_parse_uint(val, 5, &v))
                                                conf->log_level = (uint8_t)v;
                                       }},
        { "PS_ENRICH_LOG_FILE",       [](es_conf_t *conf, const char *val){
                                            es_strlcpy(conf->log_file, val, sizeof(conf->log_file));
                                       }},
        { "PS_ENRICH_LOG_ROT_MB",     [](es_conf_t *conf, const char *val){
                                            unsigned long v;
                                            if (!es_parse_uint(val, 1024, &v))
                                                conf->log_rotate_mb = (uint32_t)v;
                                       }},
        { "PS_ENRICH_LOG_BACKUPS",    [](es_conf_t *conf, const char *val){
                                            unsigned long v;
                                            if (!es_parse_uint(val, 50, &v))
                                                conf->log_rotate_backups = (uint32_t)v;
                                       }},

        /* Health check */
        { "PS_ENRICH_HEALTH_PORT",    [](es_conf_t *conf, const char *val){
                                            unsigned long v;
                                            if (!es_parse_uint(val, 65535, &v))
                                                conf->health_port = (uint16_t)v;
                                       }},
        { "PS_ENRICH_HEALTH_BIND",    [](es_conf_t *conf, const char *val){
                                            es_strlcpy(conf->health_bind_addr, val, sizeof(conf->health_bind_addr));
                                       }},

        /* Shutdown */
        { "PS_ENRICH_SHUTDOWN_SEC",   [](es_conf_t *conf, const char *val){
                                            unsigned long v;
                                            if (!es_parse_uint(val, 600, &v))
                                                conf->shutdown_graceful_timeout_sec = (uint32_t)v;
                                       }},
    };

    for (size_t i = 0; i < sizeof(table)/sizeof(table[0]); ++i) {
        const char *v = getenv(table[i].env_key);
        if (v && *v) table[i].apply(c, v);
    }
}

/* ------------------------------------------------------------------ */
/*             Validate configuration consistency / sanity            */
/* ------------------------------------------------------------------ */

static inline int
es_conf_validate(const es_conf_t *c, char *errbuf, size_t errbuf_sz)
{
    if (!c) {
        if (errbuf && errbuf_sz) snprintf(errbuf, errbuf_sz, "Config pointer NULL");
        return -1;
    }

    if (c->worker_count == 0 || c->worker_count > ES_MAX_WORKERS) {
        if (errbuf && errbuf_sz) snprintf(errbuf, errbuf_sz,
                                          "worker_count (%u) out of range (1..%u)",
                                           c->worker_count, ES_MAX_WORKERS);
        return -1;
    }

    if (c->bp_soft_threshold >= c->bp_hard_threshold) {
        if (errbuf && errbuf_sz) snprintf(errbuf, errbuf_sz,
                                          "bp_soft_threshold >= bp_hard_threshold");
        return -1;
    }

    /* Ensure buffer size is power of two for ring-buffer optimisation */
    if ((c->event_buffer_size & (c->event_buffer_size - 1)) != 0) {
        if (errbuf && errbuf_sz) snprintf(errbuf, errbuf_sz,
                                          "event_buffer_size (%"PRIu32") not power of two",
                                          c->event_buffer_size);
        return -1;
    }

    /* Additional validations can be added here */
    return 0; /* success */
}

/* ------------------------------------------------------------------ */
/*                    Human-readable dump of config                    */
/* ------------------------------------------------------------------ */

