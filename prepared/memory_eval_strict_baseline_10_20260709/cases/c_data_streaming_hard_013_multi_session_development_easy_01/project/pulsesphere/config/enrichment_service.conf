{
    if (!c) return;
    if (!out) out = stdout;

    fprintf(out,
        "----- PulseSphere Enrichment Configuration -----\n"
        "API Version               : %u.%u.%u\n"
        "Workers                   : %u\n"
        "Plugin Dir                : %s\n"
        "Geo DB Path               : %s\n"
        "Language Model Path       : %s\n"
        "Toxicity Model Path       : %s\n"
        "Kafka Brokers             : %s\n"
        "Kafka Group ID            : %s\n"
        "Kafka Pulse Topic         : %s\n"
        "Kafka Enriched Topic      : %s\n"
        "Event Buffer Size         : %"PRIu32"\n"
        "Event Maximum Size        : %"PRIu32"\n"
        "Late Event Window (ms)    : %"PRIu32"\n"
        "Metrics Flush (sec)       : %"PRIu32"\n"
        "Backpressure Soft (%)     : %u\n"
        "Backpressure Hard (%)     : %u\n"
        "TLS Enabled               : %u\n"
        "TLS Cert Path             : %s\n"
        "TLS Key Path              : %s\n"
        "TLS CA Path               : %s\n"
        "Log Level                 : %u\n"
        "Log File                  : %s\n"
        "Log Rotate (MB)           : %"PRIu32"\n"
        "Log Backups               : %"PRIu32"\n"
        "Health Port               : %u\n"
        "Health Bind Addr          : %s\n"
        "Shutdown Grace (sec)      : %"PRIu32"\n"
        "------------------------------------------------\n",
        ES_CONF_API_MAJOR, ES_CONF_API_MINOR, ES_CONF_API_PATCH,
        c->worker_count,
        c->plugin_dir,
        c->geo_db_path,
        c->lang_model_path,
        c->tox_model_path,
        c->kafka_brokers,
        c->kafka_group_id,
        c->kafka_pulse_topic,
        c->kafka_enrich_topic,
        c->event_buffer_size,
        c->event_max_size,
        c->late_event_window_ms,
        c->metrics_flush_interval_sec,
        c->bp_soft_threshold,
        c->bp_hard_threshold,
        c->tls_enable,
        c->tls_cert_path,
        c->tls_key_path,
        c->tls_ca_path,
        c->log_level,
        c->log_file,
        c->log_rotate_mb,
        c->log_rotate_backups,
        c->health_port,
        c->health_bind_addr,
        c->shutdown_graceful_timeout_sec
    );
}

/* ------------------------------------------------------------------ */
/*                         Public Convenience API                      */
/* ------------------------------------------------------------------ */

/*
 *  es_conf_load()
 *  --------------------------------------------------------------
 *  Populates the provided es_conf_t structure with defaults,
 *  overrides from the environment, and validates the result.
 *
 *  Returns 0 on success, -1 on error (errbuf populated if provided).
 */
static inline int
es_conf_load(es_conf_t *dest, char *errbuf, size_t errbuf_sz)
{
    if (!dest) {
        if (errbuf && errbuf_sz) snprintf(errbuf, errbuf_sz, "dest is NULL");
        return -1;
    }

    es_conf_init_defaults(dest);
    es_conf_override_from_env(dest);

    if (es_conf_validate(dest, errbuf, errbuf_sz) != 0)
        return -1;

    return 0;
}

#endif /* PULSESHPERE_ENRICHMENT_SERVICE_CONF */
