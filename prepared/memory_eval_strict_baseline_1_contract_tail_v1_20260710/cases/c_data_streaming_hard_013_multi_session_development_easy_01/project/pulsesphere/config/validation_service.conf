/*
 * PulseSphere Validation Service Configuration
 * File: pulsesphere/config/validation_service.conf
 *
 * Syntax: libconfig (https://hyperrealm.github.io/libconfig/)
 * --------------------------------------------------------------------
 * This configuration file drives the behaviour of the real-time
 * validation micro-service.  It is parsed at start-up by libconfig,
 * therefore the grammar is C-like and supports comments.
 *
 * NOTE:
 *   • All filesystem paths are assumed to be absolute.
 *   • Environment variable expansion is handled by the launcher script,
 *     NOT the service itself—keep plain strings here.
 *   • Changes applied at runtime via SIGHUP unless otherwise stated.
 * --------------------------------------------------------------------
 */

validation_service :
{
  /*------------------------------------------------------------------*/
  /* Meta & Versioning                                                */
  /*------------------------------------------------------------------*/
  version           = "2.4.1";     // Service semantic version
  build_id          = "@GIT_SHA@"; // Auto-substituted by CI/CD

  /*------------------------------------------------------------------*/
  /* Logging                                                          */
  /*------------------------------------------------------------------*/
  logging :
  {
    level           = "INFO";                          // TRACE|DEBUG|INFO|WARN|ERROR|FATAL
    file            = "/var/log/pulsesphere/validator/validator.log";
    rotation :
    {
      size_mb       = 512;     // Rotate when log exceeds this size
      keep_files    = 7;       // Number of rotated files to keep
      compress      = true;    // Gzip rotated logs
    };
    syslog :
    {
      enabled       = false;   // If true, duplicates log to local syslog
      facility      = "local4";
    };
  };

  /*------------------------------------------------------------------*/
  /* Networking & IPC                                                 */
  /*------------------------------------------------------------------*/
  network :
  {
    listen_addr     = "0.0.0.0";
    listen_port     = 8090;
    backlog         = 1024;    // Accept queue length

    tls :
    {
      enabled       = true;
      certificate   = "/etc/pulsesphere/certs/validation.pem";
      private_key   = "/etc/pulsesphere/certs/validation.key";
      ca_bundle     = "/etc/pulsesphere/certs/ca-chain.crt";
      min_tls_ver   = "1.2";
      ciphers       = "HIGH:!aNULL:!MD5";
    };
  };

  /*------------------------------------------------------------------*/
  /* Input Sources                                                    */
  /*------------------------------------------------------------------*/
  input_queues = (
    {
      name          = "ingest-raw";
      broker_uri    = "amqp://validator@mq01.pulsesphere.net:5672/";
      vhost         = "/";
      durable       = true;
      prefetch      = 5_000;   // Maximum messages to buffer per worker
      parallelism   = 12;      // Spawn N consumer threads
    },
    {
      name          = "replay-window";
      broker_uri    = "amqp://validator@mq01.pulsesphere.net:5672/";
      vhost         = "/";
      durable       = true;
      prefetch      = 2_000;
      parallelism   = 4;
    }
  );

  /*------------------------------------------------------------------*/
  /* Schema Registry                                                  */
  /*------------------------------------------------------------------*/
  schema_registry :
  {
    type            = "embedded"; // embedded | remote
    path            = "/etc/pulsesphere/schemas";
    remote_uri      = "https://schema-registry.pulsesphere.net"; // used if type == "remote"
    refresh_sec     = 300;  // Poll interval for registry updates
    cache_size_mb   = 128;  // Memory cap for compiled schemas
  };

  /*------------------------------------------------------------------*/
  /* Validation Pipeline                                              */
  /*------------------------------------------------------------------*/
  validators = (
    {
      id            = "pulse-core-v1";
      schema_file   = "pulse_core.avsc";
      plugin_lib    = "/usr/lib/pulsesphere/plugins/validator_avro.so";
      strict_mode   = true;      // Reject on ANY mismatch
      fail_on_warn  = true;
    },
    {
      id            = "pulse-metadata-v1";
      schema_file   = "pulse_metadata.json";
      plugin_lib    = "/usr/lib/pulsesphere/plugins/validator_json.so";
      strict_mode   = false;     // Allow unknown fields
      fail_on_warn  = false;
    }
  );

  /*------------------------------------------------------------------*/
  /* Enrichment Pipeline (Strategy Pattern)                           */
  /*------------------------------------------------------------------*/
  enrichment_pipeline :
  {
    enabled         = true;
    workers         = 8;          // Worker threads per CPU socket
    max_queue_len   = 200_000;    // Back-pressure threshold
    timeout_ms      = 25;         // Hard timeout for each plugin

    plugins = (
      { name = "geotag",     lib = "/usr/lib/pulsesphere/plugins/enrich_geo.so";     order = 10; },
      { name = "langdet",    lib = "/usr/lib/pulsesphere/plugins/enrich_lang.so";    order = 20; },
      { name = "toxscore",   lib = "/usr/lib/pulsesphere/plugins/enrich_toxic.so";   order = 30; }
    );
  };

  /*------------------------------------------------------------------*/
  /* Quality of Service & Back-Pressure                               */
  /*------------------------------------------------------------------*/
  qos :
  {
    max_end_to_end_latency_ms = 75;   // SLA for message from receive to publish
    high_watermark            = 0.85; // Pause consumers above this usage
    low_watermark             = 0.40; // Resume consumers below this usage
  };

  /*------------------------------------------------------------------*/
  /* Output                                                           */
  /*------------------------------------------------------------------*/
  output :
  {
    stream_name      = "validated-pulse";
    broker_uri       = "kafka://kfk01.pulsesphere.net:9092,kfk02.pulsesphere.net:9092";
    acks             = "all";
    compression      = "lz4";
    partition_key    = "pulse_id";      // Field used to partition events
    max_batch_bytes  = 1_048_576;       // 1 MB
    linger_ms        = 10;
  };

  /*------------------------------------------------------------------*/
  /* Error Handling                                                   */
  /*------------------------------------------------------------------*/
  error_policy :
  {
    max_retries      = 5;
    backoff_ms       = 250, 500, 1_000, 2_000; // Jitter added automatically
    dlq :
    {
      enabled        = true;
      queue_name     = "validator-dlq";
      retention_days = 7;
    };
  };

  /*------------------------------------------------------------------*/
  /* Metrics & Health                                                 */
  /*------------------------------------------------------------------*/
  metrics :
  {
    enabled          = true;
    type             = "prometheus";            // prometheus | statsd | none
    endpoint         = "http://localhost:9091";
    push_interval_s  = 15;
    namespace        = "pulsesphere_validation";
    constant_labels  = ( "env=prod", "region=us-east-1" );
  };

  health :
  {
    liveness_path    = "/var/run/pulsesphere/validator.liveness";
    readiness_path   = "/var/run/pulsesphere/validator.readiness";
    interval_sec     = 5;
    fail_after_sec   = 30;
  };

  /*------------------------------------------------------------------*/
  /* Security                                                         */
  /*------------------------------------------------------------------*/
  security :
  {
    ip_allowlist     = ( "10.0.0.0/8", "192.168.1.0/24", "127.0.0.1/32" );
    rate_limit_rps   = 15_000;  // Global max requests per second
    authz :
    {
      enabled        = true;
      provider       = "opa";   // Open Policy Agent side-car
      endpoint       = "http://localhost:8181/v1/data/pulsesphere/validator/allow";
      cache_ttl_s    = 60;
    };
  };

  /*------------------------------------------------------------------*/
  /* Resource Limits                                                  */
  /*------------------------------------------------------------------*/
  resources :
  {
    max_memory_mb    = 3072;   // Hard RSS cap; enforced via cgroups
    max_cpu_percent  = 85;     // Throttle if average > 85%
  };

  /*------------------------------------------------------------------*/
  /* House-Keeping                                                    */
  /*------------------------------------------------------------------*/
  housekeeping :
  {
    snapshot_interval_min = 60;   // Persist state every N minutes
    temp_dir              = "/var/lib/pulsesphere/validator/tmp";
    purge_after_hours     = 24;   // Delete temp files older than N hours
  };
};