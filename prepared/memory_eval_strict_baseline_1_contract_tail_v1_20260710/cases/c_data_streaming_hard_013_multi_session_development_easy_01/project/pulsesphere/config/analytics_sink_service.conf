/*
 * PulseSphere – Analytics Sink Service Configuration
 * File: pulsesphere/config/analytics_sink_service.conf
 *
 * Syntax: libconfig 1.7.x
 *
 * Overview:
 *   - Consumes validated + enriched events from the upstream event fabric
 *   - Persists data into multiple analytical sinks (Cassandra + S3-Data-Lake)
 *   - Exports Prometheus metrics and Jaeger tracing
 *   - Tuned for high-throughput / low-latency streaming workloads
 *
 * NOTE:
 *   • Any setting ending with “_env” expects the key to be provided via an
 *     environment variable at process start-up (keeps secrets out of Git).
 *   • Values marked “(opt)” are optional; remove the line to accept defaults.
 */

analytics_sink_service:
{
    /* ─────────────────────────────
     * Instance Identity & Control
     * ───────────────────────────── */
    instance_id     = "analytics-sink-1";
    enable          = true;                 // Disable to run in dry-run mode
    bind_address    = "0.0.0.0";
    bind_port       = 7020;                 // gRPC management server

    /* ─────────────────────────────
     * Upstream Event Bus Subscription
     * ───────────────────────────── */
    event_bus :
    {
        brokers = (
            "kafka01.pulsesphere.local:9092",
            "kafka02.pulsesphere.local:9092",
            "kafka03.pulsesphere.local:9092"
        );

        topic          = "pulse.enriched";
        consumer_group = "analytics-sink-service";
        offset_reset   = "earliest";        // earliest | latest
        enable_tls     = true;

        batching :
        {
            max_batch_size = 50000;         // Events per commit
            max_wait_ms    = 200;           // Flush even if batch not full
        };

        tls :
        {
            ca_cert        = "/etc/pulsesphere/ssl/ca.pem";
            client_cert    = "/etc/pulsesphere/ssl/analytics-sink-service.pem";
            client_key     = "/etc/pulsesphere/ssl/analytics-sink-service.key";
            verify_hostname = true;
        };
    };

    /* ─────────────────────────────
     * Downstream Analytical Sinks
     * ───────────────────────────── */
    sinks : (
        /* Cassandra (primary, time-series) */
        {
            name        = "timeseries_cassandra_primary";
            type        = "cassandra";
            enable      = true;

            hosts       = (
                "cass01.pulsesphere.local",
                "cass02.pulsesphere.local",
                "cass03.pulsesphere.local"
            );

            keyspace    = "pulsesphere_analytics";
            table       = "social_pulse_events";
            consistency = "QUORUM";       // ONE | TWO | QUORUM | LOCAL_QUORUM | ALL

            credentials :
            {
                username       = "pulsesphere";
                password_env   = "PS_CASSANDRA_PASS"; // $PS_CASSANDRA_PASS
            };

            pool :
            {
                max_connections = 32;
                timeout_ms      = 5000;
            };

            retry_policy :
            {
                max_retries   = 6;
                backoff_ms    = 250;
                jitter_pct    = 35;
            };
        },

        /* S3 Data Lake (fallback / cold storage) */
        {
            name        = "data_lake_s3_fallback";
            type        = "s3";
            enable      = true;

            bucket      = "pulsesphere-data-lake";
            region      = "us-east-1";
            acl         = "bucket-owner-full-control";
            prefix      = "/raw/pulses/";

            credentials_profile = "pulsesphere-prod"; // AWS profile (opt)

            format      = "parquet";                // parquet | json | avro

            rotation :
            {
                max_file_size_mb      = 1024;       // 1 GiB
                max_file_age_sec      = 900;        // 15 min
                max_unflushed_events  = 250000;
            };

            retry_policy :
            {
                max_retries   = 10;
                backoff_ms    = 500;
                jitter_pct    = 45;
            };
        }
    );

    /* ─────────────────────────────
     * I/O & Performance Tuning
     * ───────────────────────────── */
    io :
    {
        recv_buffer_bytes = 1048576;   // 1 MiB
        send_buffer_bytes = 1048576;
        compression       = "lz4";     // none | gzip | lz4 | zstd
    };

    /* ─────────────────────────────
     * Observability
     * ───────────────────────────── */
    metrics :
    {
        enable                 = true;
        bind_address           = "127.0.0.1";
        bind_port              = 9306;
        format                 = "prometheus";
        collection_interval_s  = 10;
    };

    tracing :
    {
        enable        = true;
        provider      = "jaeger";              // jaeger | zipkin | otlp
        jaeger :
        {
            agent_host   = "jaeger-agent.monitoring.svc.cluster.local";
            agent_port   = 6831;
            service_name = "analytics-sink-service";
            sample_rate  = 0.25;               // 25 % of traces
        };
    };

    logging :
    {
        level         = "INFO";                // DEBUG | INFO | WARN | ERROR | FATAL
        destination   = "syslog";             // console | file | syslog
        file_path     = "/var/log/pulsesphere/analytics_sink_service.log"; // if file

        rotation :
        {
            max_size_mb  = 100;
            max_files    = 10;
            compress     = true;
        };
    };

    /* ─────────────────────────────
     * Health & Lifecycle Management
     * ───────────────────────────── */
    health :
    {
        bind_address  = "0.0.0.0";
        bind_port     = 8070;
        liveness_path = "/health/liveness";
        readiness_path= "/health/readiness";
    };

    graceful_shutdown :
    {
        drain_timeout_sec = 30;   // Stop pulling new events
        flush_timeout_sec = 120;  // Finish writing buffered data
    };
};