# ============================================================================
#  PulseSphere Dashboard Service – Runtime Configuration File
#  File:    pulsesphere/config/dashboard_service.conf
#
#  Overview:
#  This configuration file governs the behaviour of the Dashboard Service
#  (written in C) that subscribes to curated event streams and exposes real-time
#  operational metrics/visualisations over a WebSocket & REST interface.
#
#  Format:
#  - INI-style sections
#  - Key/Value pairs are case-insensitive
#  - Values that contain whitespace must be quoted
#  - Environment variable substitution is supported via ${VAR}
#  - All time durations use the ISO-8601/Go time format (e.g., "30s", "15m")
#
#  Security Notes:
#  • Sensitive tokens/secrets MAY be provided via ${ENVVAR} indirection only.
#  • Never commit plaintext credentials to version control.
# ============================================================================


###############################################################################
# [service] – Core Service Parameters
###############################################################################
[service]
# Unique instance identifier (auto-generated if blank)
instance_id                 = ""

# Human-readable service name (used in logs and metrics labels)
name                        = "pulsesphere-dashboard"

# Service version (will be overwritten at build time by CI pipeline)
version                     = "0.0.0-dev"

# Working directory (paths inside config are resolved relative to this dir)
working_dir                 = "/var/lib/pulsesphere/dashboard"

# Number of event-processing worker threads (0 = auto, based on logical CPUs)
worker_threads              = 0

# Size of bounded in-memory queue buffering inbound pulse events
worker_queue_capacity       = 524288           # 512k events

# Maximum number of simultaneous WebSocket client sessions
max_websocket_sessions      = 2048

# Graceful shutdown timeout – how long to wait for in-flight work to drain
shutdown_timeout            = "25s"



###############################################################################
# [network] – Socket, TLS, and Reverse-Proxy Settings
###############################################################################
[network]
# Public listen address for HTTP/1.1 & HTTP/2 REST endpoints
http_listen_addr            = "0.0.0.0:8080"

# Public listen address for WebSocket endpoint (leave blank to share HTTP port)
websocket_listen_addr       = ""

# Enable HTTP compression for REST responses
enable_compression          = true

# Idle TCP connection timeout
idle_timeout                = "120s"

# Maximum request body size accepted by REST routes (in bytes)
max_request_body            = 1048576          # 1 MiB

# Enforce TLS?  (If true, cert_file and key_file must be provided)
enable_tls                  = false
cert_file                   = "/etc/pulsesphere/certs/dashboard.crt"
key_file                    = "/etc/pulsesphere/certs/dashboard.key"

# When behind a reverse proxy, trust X-Forwarded-* headers
# Accepts "always", "loopback", "never"
proxy_mode                  = "loopback"



###############################################################################
# [stream] – Event Fabric Subscription & Back-Pressure Controls
###############################################################################
[stream]
# Kafka bootstrap brokers (comma-separated)
brokers                     = "kafka-1:9092,kafka-2:9092,kafka-3:9092"

# Topic containing curated/enriched pulse events
topic                       = "pulsesphere.enriched.pulse.v1"

# Group-id for this dashboard instance (enable consumer rebalancing)
consumer_group              = "dashboard-frontend"

# Maximum number of uncommitted messages held in memory per partition
max_inflight_messages       = 8192

# How often to commit consumer offsets (set "0s" to disable auto-commit)
auto_commit_interval        = "5s"

# Back-pressure: if avg inbox latency exceeds threshold, temporarily pause
latency_pause_threshold     = "150ms"
latency_resume_threshold    = "75ms"

# Reconnection/back-off policy
reconnect_min_delay         = "500ms"
reconnect_max_delay         = "30s"
reconnect_multiplier        = 2.0



###############################################################################
# [cache] – Hot Path In-Memory Caching
###############################################################################
[cache]
# Eviction algorithm: "lru", "lfu", "arc"
eviction_policy             = "arc"

# Maximum entries (0 = unlimited, constrained only by memory)
max_entries                 = 100000

# Default TTL for derived metrics cached for UI clients
default_ttl                 = "10s"



###############################################################################
# [metrics] – Prometheus & Internal Telemetry
###############################################################################
[metrics]
# Bind address for Prometheus scrape endpoint
prometheus_listen_addr      = "0.0.0.0:9100"

# Enable high-cardinality label sets (slightly higher memory usage)
enable_detailed_labels      = true

# Sampling rate for histograms/timers (1.0 = 100%)
sampling_rate               = 1.0



###############################################################################
# [logging] – Log Output & Rotation
###############################################################################
[logging]
# Level: trace, debug, info, warn, error, fatal
level                       = "info"

# Log format: "json" or "plain"
format                      = "json"

# Path to log file (leave blank for stdout only)
file                        = "/var/log/pulsesphere/dashboard.log"

# Max size in MiB before rotation
max_size_mb                 = 128

# Max number of rotated files to keep
max_backups                 = 7

# Max age of rotated files before deletion
max_age_days                = 14

# Compress rotated logs?
compress                    = true



###############################################################################
# [alerting] – Thresholds & Circuit-Breaker Settings
###############################################################################
[alerting]
# Alert when queue utilisation exceeds percentage threshold
queue_highwater_percent     = 85

# Open circuit if downstream analytics sink returns 5xx > N times in window
circuit_breaker_threshold   = 10
circuit_breaker_window      = "30s"
circuit_breaker_cooldown    = "60s"



###############################################################################
# [auth] – JWT Validation & RBAC
###############################################################################
[auth]
# Enable JWT validation for REST & WebSocket endpoints
enable_jwt                  = true

# Expected signing algorithm (e.g., HS256, RS256)
jwt_alg                     = "RS256"

# Public key (PEM) path or "http(s)://…" JWKS endpoint
jwt_public_key              = "/etc/pulsesphere/keys/jwt.pub"

# Accepted audience claim (comma-separated list)
jwt_audience                = "pulsesphere-dashboard"

# Role-based access control mapping file (YAML)
rbac_policy_file            = "/etc/pulsesphere/rbac/dashboard.yml"



###############################################################################
# [feature_flags] – Runtime Toggles for Canary Tests & Experiments
###############################################################################
[feature_flags]
# Turn on incremental rendering for high-frequency charts
incremental_rendering       = false

# Enable experimental sentiment heat-map widget
sentiment_heatmap           = false



###############################################################################
# [developer] – Local Development Overrides
# NOTE: These settings are ignored in production builds.
###############################################################################
[developer]
# Respond with synthetic test data instead of live stream
enable_mock_data            = false

# Hot-reload templates on change
enable_template_hot_reload  = true

# Path to UI assets (if overridden from default compiled-in assets)
ui_asset_dir                = "./ui/dist"



###############################################################################
# End of File
###############################################################################
