# ==================================================================
# PulseSphere - Real-Time Social Pulse Streaming Platform
# Ingestion Service Configuration
#
# File: pulsesphere/config/ingestion_service.conf
# Format: INI-style key = value pairs.
#
# NOTE:
#   – Environment variables can override any key by using the pattern
#     PULSES_INGEST_<SECTION>_<KEY>, e.g.:
#       export PULSES_INGEST_NETWORK_TCP_PORT=7700
#   – Unless explicitly stated, all sizes are in bytes, all durations
#     are in milliseconds, and all percentages are whole numbers.
# ==================================================================

########################################################################
#  Network & Transport Settings
########################################################################
[network]

# Address/port the ingestion listener binds to.
bind_address           = 0.0.0.0
tcp_port               = 7600

# Maximum TCP pending-connection queue depth.
listen_backlog         = 16384

# Toggle TLS for the ingestion endpoint.
enable_tls             = true
tls_cert_file          = /etc/pulsesphere/certs/ingestion.pem
tls_key_file           = /etc/pulsesphere/certs/ingestion.key

# Comma-separated TLS versions & ciphers.
tls_versions           = TLSv1.2,TLSv1.3
tls_ciphers            = ECDHE-ECDSA-AES256-GCM-SHA384,\
                         ECDHE-RSA-AES256-GCM-SHA384,\
                         ECDHE-ECDSA-CHACHA20-POLY1305

# TCP keep-alive (ms). 0  ➜  disabled.
tcp_keepalive_ms       = 45000

########################################################################
#  Worker Thread Pool
########################################################################
[worker_pool]

# Number of ingestion worker threads. Use 0 for “CPU-count – 2”.
workers                = 32

# CPU affinity mask. Use “auto” to pin workers round-robin.
affinity               = auto

# Per-worker memory ceiling (MiB). 0 ➜ unlimited (not recommended).
worker_mem_limit_mib   = 512

########################################################################
#  In-Memory / Disk-Backed Queues
########################################################################
[queue]

# Lock-free ring capacity; power-of-two strongly recommended.
ring_capacity          = 131072

# Optional disk queue for back-pressure / crash safety.
disk_queue_path        = /var/lib/pulsesphere/queues
disk_queue_limit_mib   = 4096

########################################################################
#  Back-Pressure & Flow Control
########################################################################
[backpressure]

soft_limit_percent     = 70
hard_limit_percent     = 90

# Delay applied to publishers after soft limit hit.
throttle_usec          = 200

# Disconnect clients when hard limit sustains for N seconds.
disconnect_after_sec   = 30

########################################################################
#  Validation & Schema Management
########################################################################
[validation]

# Avro/Protobuf schema registry endpoint.
schema_registry_url    = http://schema-registry.internal:8081

# Whether to keep schemas cached in memory.
enable_schema_cache    = true
schema_cache_capacity  = 256

# Legacy JSON schema validation.
enable_json_validation = false

########################################################################
#  Enrichment Pipeline
########################################################################
[enrichment]

# Directory scanned for *.so / *.dll enrichment plug-ins.
plugin_dir             = /opt/pulsesphere/plugins/enrichment

# Colon-separated list of enrichment strategies to preload.
preload_strategies     = geo,lang,toxicity

# Per-stage timeout; events exceeding are skipped (see skip_on_timeout).
stage_timeout_ms       = 35
skip_on_timeout        = true

########################################################################
#  Retry / Resilience
########################################################################
[retry]

max_attempts           = 5
backoff_ms             = 50
backoff_multiplier     = 1.8
backoff_max_ms         = 3000

########################################################################
#  Metrics & Observability
########################################################################
[metrics]

enable_prometheus      = true
metrics_port           = 9106
flush_interval_sec     = 5

########################################################################
#  Logging
########################################################################
[logging]

# Allowed: trace | debug | info | warn | error | fatal
level                  = info

# Destination: /path/to/file | stdout | stderr | syslog[:facility]
output                 = /var/log/pulsesphere/ingestion_service.log

max_size_mib           = 100
max_backups            = 20
compress               = true

########################################################################
#  Security
########################################################################
[security]

# Example API keys (base64). For production, use HashiCorp Vault.
api_keys[]             = QVBJX0tFWV9TQU1QTEUx
api_keys[]             = QVBJX0tFWV9TQU1QTEUy

# CIDR whitelist. Use “*” to allow all.
ip_whitelist[]         = 10.0.0.0/8
ip_whitelist[]         = 172.16.0.0/12
ip_whitelist[]         = 192.168.0.0/16
ip_whitelist[]         = 127.0.0.1/32

enable_jwt             = false

########################################################################
#  House-Keeping & Lifecycle
########################################################################
[housekeeping]

grace_period_sec       = 45       # SIGTERM → stop accepting → drain → exit
compact_interval_min   = 15       # Disk-queue compaction
reload_interval_sec    = 300      # Hot-reload *.conf (0 = disabled)

# ==================================================================
# End of ingestion_service.conf
# ==================================================================